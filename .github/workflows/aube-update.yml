name: Update npm dependencies

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC (after CI)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.local/share/aube/store/v1
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Bootstrap dependencies
        run: mise run bootstrap

      - name: Update dependencies
        run: |
          set -euo pipefail
          # Stay within package.json ranges. --latest rewrites majors (e.g. TypeScript 7)
          # that tooling such as typescript-eslint may not support yet.
          if aube update --reporter append-only 2>&1 | tee /tmp/aube-update.log; then
            exit 0
          fi
          if ! grep -q 'dependencies with build scripts must be reviewed' /tmp/aube-update.log; then
            exit 1
          fi
          bash script/lib/aube-record-unreviewed-builds /tmp/aube-update.log
          aube install --reporter append-only

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: aube audit --reporter append-only 2>&1 | tee /tmp/aube-audit.log

      - name: Apply formatting from updated Prettier
        run: aube run format

      - name: Run tests
        run: mise run test

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          AUBE_AUDIT_LOG: /tmp/aube-audit.log
          AUBE_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: bash script/lib/create-aube-deps-pr
