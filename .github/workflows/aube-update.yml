name: Update npm dependencies

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC (after CI)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: true

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.local/share/aube/store/v1
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Bootstrap dependencies
        run: mise run bootstrap

      - name: Update dependencies
        run: aube update --latest

      - name: Audit dependencies
        run: aube audit

      - name: Run tests
        run: mise run test

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/aube-deps-update
          git add aube-lock.yaml package.json aube-workspace.yaml
          if git diff --staged --quiet; then
            echo "No changes detected, skipping PR creation"
            exit 0
          fi
          git commit -m 'chore(deps): update npm dependencies'
          git push origin chore/aube-deps-update --force
          body=$'Weekly automated dependency update via aube.\n\nRequires manual review for allowBuilds changes and security advisories.'
          gh pr view chore/aube-deps-update >/dev/null 2>&1 || gh pr create \
            --title 'chore(deps): update npm dependencies' \
            --body "$body" \
            --base main \
            --head chore/aube-deps-update
