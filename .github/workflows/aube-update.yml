name: Update npm dependencies

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC (after CI)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: true

      - name: Cache aube store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.local/share/aube/store/v1
          key: ${{ runner.os }}-aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Bootstrap dependencies
        run: mise run bootstrap

      - name: Update dependencies
        run: aube update --latest

      - name: Audit dependencies
        run: aube audit

      - name: Run tests
        run: mise run test

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/lib/create-aube-deps-pr
